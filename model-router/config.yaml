# llama-stack server (shared by all LLMs — primary and secondaries)
llama_stack:
  url: "http://llama-stack:8321"

# Primary LLM — its response is returned to the client
primary:
  name: "llama-stack-primary"
  # Reads from PRIMARY_MODEL env var at startup, falls back to model_id below
  model_id_env: "PRIMARY_MODEL"
  model_id: "meta-llama/Llama-3.1-8B-Instruct"
  timeout: 120

# Secondary LLMs — called concurrently with the primary, results go to collector
llms:
  - name: "openai-gpt4o"
    model_id: "gpt-4o"
    timeout: 60
    enabled: true

  - name: "anthropic-claude-sonnet"
    model_id: "claude-3-5-sonnet-20241022"
    timeout: 60
    enabled: true

  - name: "together-llama70b"
    model_id: "meta-llama/Llama-3.1-70B-Instruct-Turbo"
    timeout: 60
    enabled: false

  - name: "vllm-llama70b"
    model_id: "meta-llama/Llama-3.1-70B-Instruct"
    timeout: 120
    enabled: false

collector:
  url: "http://collector:8001"
  timeout: 5
