# llama-stack server connection (shared by all secondary LLM calls)
llama_stack:
  url: "http://llama-stack:8321"

llms:
  # Each entry maps a friendly name to a model_id registered in llama-stack's run.yaml.
  # llama-stack routes each model_id to the correct backend provider.

  - name: "openai-gpt4o"
    model_id: "gpt-4o"
    timeout: 60
    enabled: true

  - name: "anthropic-claude-sonnet"
    model_id: "claude-3-5-sonnet-20241022"
    timeout: 60
    enabled: true

  - name: "together-llama70b"
    model_id: "meta-llama/Llama-3.1-70B-Instruct-Turbo"
    timeout: 60
    enabled: false

  - name: "ollama-llama70b"
    model_id: "llama3.1:70b"
    timeout: 120
    enabled: false

collector:
  url: "http://collector:8001"
  timeout: 5
  capture_primary: true
  primary_name: "llama-stack-primary"
  primary_model_env: "PRIMARY_MODEL"
  primary_model_default: "meta-llama/Llama-3.1-8B-Instruct"
