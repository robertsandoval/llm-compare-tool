version: "3.9"

# LLM Comparison Tool — Local Development
# No Envoy required. The model-router is the single entry point.
#
# Run with:  podman-compose up -d
# Build:     podman-compose build

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  collector:
    build:
      context: ./collector
      dockerfile: Containerfile
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RECORD_TTL_SECONDS=${RECORD_TTL_SECONDS:-86400}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # vLLM — self-hosted local LLM backend (requires GPU or CPU-fallback build).
  # If you are running vLLM externally, remove this service and set
  # VLLM_URL in your environment to point at your running instance.
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - "--model"
      - "${PRIMARY_MODEL:-meta-llama/Llama-3.1-8B-Instruct}"
      - "--port"
      - "8000"
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    # Uncomment for NVIDIA GPU passthrough (Linux hosts only):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  llama-stack:
    build:
      context: ./llama-stack
      dockerfile: Containerfile
    ports:
      - "8321:8321"
    environment:
      - LLAMA_STACK_PORT=8321
      - INFERENCE_MODEL=${PRIMARY_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - VLLM_URL=${VLLM_URL:-http://vllm:8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    volumes:
      - llama-stack-data:/root/.llama
      - ./llama-stack/run.yaml:/app/run.yaml:ro
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8321/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Model router is the single API entry point — no Envoy needed.
  # Primary and secondary LLMs are called concurrently from here.
  model-router:
    build:
      context: ./model-router
      dockerfile: Containerfile
    ports:
      - "8080:8000"
    environment:
      - PRIMARY_MODEL=${PRIMARY_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./model-router/config.yaml:/app/config.yaml:ro
    depends_on:
      collector:
        condition: service_healthy
      llama-stack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  llama-stack-data:
  vllm-model-cache:
