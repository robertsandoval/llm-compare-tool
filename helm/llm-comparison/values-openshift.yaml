# values-openshift.yaml
# OpenShift 4.21 — production overlay
#
# Usage:
#   helm install llm-comparison ./helm/llm-comparison \
#     -n llm-comparison --create-namespace \
#     -f helm/llm-comparison/values-openshift.yaml \
#     --set apiKeys.openai=$OPENAI_API_KEY \
#     --set apiKeys.anthropic=$ANTHROPIC_API_KEY

global:
  imageRegistry: "quay.io/your-org"
  imagePullPolicy: Always

routes:
  enabled: true
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  modelRouter:
    host: ""   # leave blank for auto-generated *.apps.<cluster>
  collector:
    host: ""

ingress:
  enabled: false

modelRouter:
  replicas: 2
  logLevel: INFO
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  llms:
    - name: "openai-gpt4o"
      modelId: "gpt-4o"
      providerId: "openai"
      providerModelId: "gpt-4o"
      timeout: 60
      enabled: true
    - name: "anthropic-claude-sonnet"
      modelId: "claude-3-5-sonnet-20241022"
      providerId: "anthropic"
      providerModelId: "claude-3-5-sonnet-20241022"
      timeout: 60
      enabled: true

collector:
  replicas: 2
  recordTtlSeconds: 172800
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  persistence:
    enabled: true
    size: 5Gi
    # storageClassName: gp3-csi

llamaStack:
  image:
    repository: llm-comparison-llama-stack
    tag: latest
  provider: vllm
  backendUrl: "http://vllm:8000"
  primaryModel: "meta-llama/Llama-3.1-8B-Instruct"
  primaryModelId: "meta-llama/Llama-3.1-8B-Instruct"
  persistence:
    enabled: true
    size: 20Gi
    # storageClassName: gp3-csi
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"
  gpuResources:
    enabled: false
    limits: {}
  nodeSelector: {}
  tolerations: []
