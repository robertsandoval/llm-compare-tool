{{- if .Values.routes.enabled }}
---
# Model Router — single external entry point (replaces Envoy)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "llm-comparison.modelRouterName" . }}
  namespace: {{ include "llm-comparison.namespace" . }}
  labels:
    {{- include "llm-comparison.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  {{- if .Values.routes.modelRouter.host }}
  host: {{ .Values.routes.modelRouter.host | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "llm-comparison.modelRouterName" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.routes.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.routes.tls.insecureEdgeTerminationPolicy }}
  wildcardPolicy: None

---
# Collector — for querying comparison results
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "llm-comparison.collectorName" . }}
  namespace: {{ include "llm-comparison.namespace" . }}
  labels:
    {{- include "llm-comparison.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  {{- if .Values.routes.collector.host }}
  host: {{ .Values.routes.collector.host | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "llm-comparison.collectorName" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.routes.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.routes.tls.insecureEdgeTerminationPolicy }}
  wildcardPolicy: None
{{- end }}
