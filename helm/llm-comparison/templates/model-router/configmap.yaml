{{- if .Values.modelRouter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-comparison.modelRouterName" . }}-config
  namespace: {{ include "llm-comparison.namespace" . }}
  labels:
    {{- include "llm-comparison.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
data:
  config.yaml: |
    {{- include "llm-comparison.modelRouterConfig" . | nindent 4 }}
{{- end }}
