{{- if .Values.collector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-comparison.collectorName" . }}
  namespace: {{ include "llm-comparison.namespace" . }}
  labels:
    {{- include "llm-comparison.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  type: ClusterIP
  selector:
    {{- include "llm-comparison.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  ports:
  - name: http
    port: 8001
    targetPort: 8001
    protocol: TCP
{{- end }}
