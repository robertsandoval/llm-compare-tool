{{- if not .Values.apiKeys.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-comparison.fullname" . }}-api-keys
  namespace: {{ include "llm-comparison.namespace" . }}
  labels:
    {{- include "llm-comparison.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.apiKeys.openai | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.apiKeys.anthropic | default "" | quote }}
  TOGETHER_API_KEY: {{ .Values.apiKeys.together | default "" | quote }}
{{- end }}
