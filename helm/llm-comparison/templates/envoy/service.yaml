{{- if .Values.envoy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-comparison.envoyName" . }}
  namespace: {{ include "llm-comparison.namespace" . }}
  labels:
    {{- include "llm-comparison.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.envoy.service.type }}
  selector:
    {{- include "llm-comparison.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
  - name: http
    port: {{ .Values.envoy.service.port }}
    targetPort: 8080
    protocol: TCP
  - name: admin
    port: {{ .Values.envoy.service.adminPort }}
    targetPort: 9901
    protocol: TCP
{{- end }}
