# ─────────────────────────────────────────────────────────────────────────────
# LLM Comparison Tool — Helm Values
#
# Override any value with:
#   helm install llm-comparison ./helm/llm-comparison -f my-values.yaml
#   helm install llm-comparison ./helm/llm-comparison --set envoy.replicas=2
# ─────────────────────────────────────────────────────────────────────────────

# ── Global ────────────────────────────────────────────────────────────────────
global:
  # Prepended to all image names that don't have a registry specified.
  # Set to your internal registry, e.g. quay.io/my-org
  imageRegistry: ""
  imagePullPolicy: Always
  # Common labels applied to every resource
  labels: {}
  # Common annotations applied to every resource
  annotations: {}

# ── Namespace ─────────────────────────────────────────────────────────────────
# Set to "" to deploy into the namespace selected by helm install -n <ns>
namespaceOverride: ""

# ── API Keys ──────────────────────────────────────────────────────────────────
apiKeys:
  # If set, the chart will NOT create a Secret — it will reference this
  # existing secret for OPENAI_API_KEY, ANTHROPIC_API_KEY, TOGETHER_API_KEY.
  existingSecret: ""

  # Plaintext values used when existingSecret is empty.
  # These are base64-encoded automatically by Helm when creating the Secret.
  # In production, use existingSecret + Vault/SealedSecrets instead.
  openai: ""
  anthropic: ""
  together: ""

# ── Envoy Proxy ───────────────────────────────────────────────────────────────
envoy:
  enabled: true
  image:
    repository: envoyproxy/envoy
    tag: v1.31-latest
    # Override global.imageRegistry for this image (uses upstream Docker Hub)
    registryOverride: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080
    adminPort: 9901
  # Upstream connection timeout for LLM calls (seconds)
  upstreamTimeoutSeconds: 120
  # Upstream idle timeout (seconds)
  idleTimeoutSeconds: 300
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Model Router ──────────────────────────────────────────────────────────────
modelRouter:
  enabled: true
  image:
    repository: llm-comparison-model-router
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  logLevel: INFO
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Secondary LLM configuration.
  # Each entry defines one LLM that receives a mirrored request with its
  # model name substituted for the original.
  llms:
    - name: "openai-gpt4o"
      baseUrl: "https://api.openai.com/v1"
      model: "gpt-4o"
      apiKeyEnv: "OPENAI_API_KEY"
      provider: "openai"
      timeout: 60
      enabled: true

    - name: "anthropic-claude-sonnet"
      baseUrl: "https://api.anthropic.com/v1"
      model: "claude-3-5-sonnet-20241022"
      apiKeyEnv: "ANTHROPIC_API_KEY"
      provider: "anthropic"
      timeout: 60
      enabled: true

    - name: "together-llama70b"
      baseUrl: "https://api.together.xyz/v1"
      model: "meta-llama/Llama-3.1-70B-Instruct-Turbo"
      apiKeyEnv: "TOGETHER_API_KEY"
      provider: "openai_compatible"
      timeout: 60
      enabled: false

    - name: "ollama-llama70b"
      baseUrl: "http://ollama:11434/v1"
      model: "llama3.1:70b"
      apiKeyEnv: ""
      provider: "openai_compatible"
      timeout: 120
      enabled: false

  collector:
    # Re-call primary LLM from the router to capture its response for comparison.
    # Set to false if you have a separate response-capture mechanism.
    capturePrimary: true
    primaryName: "llama-stack-primary"
    # Timeout for sending results to the Collector (seconds)
    timeout: 5

# ── Collector ─────────────────────────────────────────────────────────────────
collector:
  enabled: true
  image:
    repository: llm-comparison-collector
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  logLevel: INFO
  # How long to retain comparison records in Redis (seconds). Default: 24h.
  recordTtlSeconds: 86400
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    registryOverride: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    # storageClassName: ""  # Leave empty to use the cluster default
    size: 1Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── llama-stack (Primary LLM gateway) ────────────────────────────────────────
llamaStack:
  enabled: true
  # Use the distribution image matching your backend provider:
  #   llamastack/distribution-ollama:latest   (Ollama)
  #   llamastack/distribution-remote-vllm:latest  (vLLM)
  image:
    repository: llamastack/distribution-ollama
    tag: latest
    registryOverride: ""
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  # Model to serve as the primary LLM
  primaryModel: "meta-llama/Llama-3.1-8B-Instruct"
  # Backend provider: ollama | vllm
  provider: ollama
  # URL of the backend inference server
  backendUrl: "http://ollama:11434"
  persistence:
    enabled: true
    size: 10Gi
    # storageClassName: ""
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # For GPU-accelerated nodes on OpenShift
  gpuResources:
    enabled: false
    # nvidia.com/gpu: "1"
    limits: {}

# ── OpenShift Routes ──────────────────────────────────────────────────────────
routes:
  # Set to false on vanilla Kubernetes (use ingress instead)
  enabled: true
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  # Explicitly set hostnames, or leave empty to let OpenShift auto-generate them.
  envoy:
    host: ""
    # e.g. llm-comparison.apps.your-cluster.example.com
  collector:
    host: ""
  envoyAdmin:
    host: ""
    # Disable the admin route in production
    enabled: true

# ── Kubernetes Ingress (non-OpenShift) ────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  # - host: llm-comparison.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  hosts: []
  tls: []

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
