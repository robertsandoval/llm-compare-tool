# ─────────────────────────────────────────────────────────────────────────────
# LLM Comparison Tool — Helm Values
#
# Override any value with:
#   helm install llm-comparison ./helm/llm-comparison -f my-values.yaml
#   helm install llm-comparison ./helm/llm-comparison --set modelRouter.replicas=2
# ─────────────────────────────────────────────────────────────────────────────

# ── Global ────────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""
  imagePullPolicy: Always
  labels: {}
  annotations: {}

namespaceOverride: ""

# ── API Keys ──────────────────────────────────────────────────────────────────
apiKeys:
  existingSecret: ""
  openai: ""
  anthropic: ""
  together: ""

# ── Model Router (single entry point — no Envoy) ──────────────────────────────
modelRouter:
  enabled: true
  image:
    repository: llm-comparison-model-router
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  logLevel: INFO
  service:
    type: ClusterIP
    port: 8000
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Primary LLM — its response is returned to the client.
  primary:
    name: "llama-stack-primary"
    # model_id is read from PRIMARY_MODEL env var at startup (set via llamaStack.primaryModel)
    timeout: 120

  # Secondary LLMs — called concurrently with the primary.
  # Each model_id must be registered in the llama-stack run.yaml.
  llms:
    - name: "openai-gpt4o"
      modelId: "gpt-4o"
      providerId: "openai"
      providerModelId: "gpt-4o"
      timeout: 60
      enabled: true

    - name: "anthropic-claude-sonnet"
      modelId: "claude-3-5-sonnet-20241022"
      providerId: "anthropic"
      providerModelId: "claude-3-5-sonnet-20241022"
      timeout: 60
      enabled: true

    - name: "together-llama70b"
      modelId: "meta-llama/Llama-3.1-70B-Instruct-Turbo"
      providerId: "together"
      providerModelId: "meta-llama/Llama-3.1-70B-Instruct-Turbo"
      timeout: 60
      enabled: false

    - name: "vllm-llama70b"
      modelId: "meta-llama/Llama-3.1-70B-Instruct"
      providerId: "vllm"
      providerModelId: "meta-llama/Llama-3.1-70B-Instruct"
      timeout: 120
      enabled: false

  collector:
    timeout: 5

# ── Collector ─────────────────────────────────────────────────────────────────
collector:
  enabled: true
  image:
    repository: llm-comparison-collector
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  logLevel: INFO
  recordTtlSeconds: 86400
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    registryOverride: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── llama-stack ────────────────────────────────────────────────────────────────
llamaStack:
  enabled: true
  image:
    repository: llm-comparison-llama-stack
    tag: latest
    registryOverride: ""
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  primaryModel: "meta-llama/Llama-3.1-8B-Instruct"
  primaryModelId: "meta-llama/Llama-3.1-8B-Instruct"
  provider: vllm
  backendUrl: "http://vllm:8000"
  persistence:
    enabled: true
    size: 10Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  gpuResources:
    enabled: false
    limits: {}

# ── OpenShift Routes ──────────────────────────────────────────────────────────
routes:
  enabled: true
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  modelRouter:
    host: ""
  collector:
    host: ""

# ── Kubernetes Ingress (non-OpenShift) ────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
