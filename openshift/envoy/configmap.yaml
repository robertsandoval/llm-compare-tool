apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: llm-comparison
data:
  envoy.yaml: |
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              route_config:
                name: local_route
                virtual_hosts:
                - name: llm_comparison
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/health"
                    route:
                      cluster: primary_llm
                  - match:
                      prefix: "/"
                    route:
                      cluster: primary_llm
                      timeout: 120s
                      request_mirror_policies:
                      - cluster: model_router
                        runtime_fraction:
                          default_value:
                            numerator: 100
                            denominator: HUNDRED
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: primary_llm
        connect_timeout: 10s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: primary_llm
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: llama-stack
                    port_value: 8321
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http_protocol_options:
                idle_timeout: 300s

      - name: model_router
        connect_timeout: 10s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: model_router
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: model-router
                    port_value: 8000
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http_protocol_options:
                idle_timeout: 300s
