apiVersion: v1
kind: Service
metadata:
  name: model-router
  namespace: llm-comparison
  labels:
    app: model-router
spec:
  selector:
    app: model-router
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-router-config
  namespace: llm-comparison
data:
  config.yaml: |
    llama_stack:
      url: "http://llama-stack:8321"

    primary:
      name: "llama-stack-primary"
      model_id_env: "PRIMARY_MODEL"
      model_id: "meta-llama/Llama-3.1-8B-Instruct"
      timeout: 120

    llms:
      - name: "openai-gpt4o"
        model_id: "gpt-4o"
        timeout: 60
        enabled: true

      - name: "anthropic-claude-sonnet"
        model_id: "claude-3-5-sonnet-20241022"
        timeout: 60
        enabled: true

      - name: "together-llama70b"
        model_id: "meta-llama/Llama-3.1-70B-Instruct-Turbo"
        timeout: 60
        enabled: false

    collector:
      url: "http://collector:8001"
      timeout: 5
