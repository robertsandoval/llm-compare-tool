# OpenShift Routes — model-router is now the single external entry point.

---
# Model Router — main API gateway (replaces Envoy)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: model-router
  namespace: llm-comparison
  labels:
    app: model-router
spec:
  to:
    kind: Service
    name: model-router
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

---
# Collector API — for querying comparison results
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: collector
  namespace: llm-comparison
  labels:
    app: collector
spec:
  to:
    kind: Service
    name: collector
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
