apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-stack-run-config
  namespace: llm-comparison
data:
  run.yaml: |
    version: '2'
    image_name: llm-comparison-multi-provider

    providers:
      inference:
      - provider_id: vllm
        provider_type: remote::vllm
        config:
          url: ${env.VLLM_URL:http://vllm:8000}

      - provider_id: openai
        provider_type: remote::openai
        config:
          api_key: ${env.OPENAI_API_KEY}

      - provider_id: anthropic
        provider_type: remote::anthropic
        config:
          api_key: ${env.ANTHROPIC_API_KEY}

      - provider_id: together
        provider_type: remote::together
        config:
          api_key: ${env.TOGETHER_API_KEY}

      memory:
      - provider_id: faiss
        provider_type: inline::faiss
        config:
          kvstore:
            type: sqlite
            namespace: null
            db_path: /root/.llama/faiss_store.db

    metadata_store:
      namespace: null
      type: sqlite
      db_path: /root/.llama/registry.db

    models:
    - model_id: meta-llama/Llama-3.1-8B-Instruct
      provider_id: vllm
      provider_model_id: meta-llama/Llama-3.1-8B-Instruct
      model_type: llm

    - model_id: gpt-4o
      provider_id: openai
      provider_model_id: gpt-4o
      model_type: llm

    - model_id: claude-3-5-sonnet-20241022
      provider_id: anthropic
      provider_model_id: claude-3-5-sonnet-20241022
      model_type: llm
---
apiVersion: v1
kind: Service
metadata:
  name: llama-stack
  namespace: llm-comparison
  labels:
    app: llama-stack
spec:
  selector:
    app: llama-stack
  ports:
  - name: http
    port: 8321
    targetPort: 8321
    protocol: TCP
  type: ClusterIP
