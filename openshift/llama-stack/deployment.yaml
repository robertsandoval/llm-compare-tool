apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-stack
  namespace: llm-comparison
  labels:
    app: llama-stack
    component: primary-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-stack
  template:
    metadata:
      labels:
        app: llama-stack
        component: primary-llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 0
      containers:
      - name: llama-stack
        # Multi-provider llama-stack distribution — built from llama-stack/Dockerfile.
        # Fronts ALL LLMs (primary + secondary) through a single /v1/inference endpoint.
        image: quay.io/your-org/llm-comparison-llama-stack:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8321
          protocol: TCP
        env:
        - name: LLAMA_STACK_PORT
          value: "8321"
        - name: PRIMARY_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-comparison-config
              key: PRIMARY_MODEL
        # Self-hosted backend URL (Ollama or vLLM)
        - name: OLLAMA_URL
          value: "http://ollama:11434"
        # - name: VLLM_URL
        #   value: "http://vllm:8000"
        # Provider API keys — all injected from the shared secret
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: ANTHROPIC_API_KEY
              optional: true
        - name: TOGETHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: TOGETHER_API_KEY
              optional: true
        volumeMounts:
        - name: llama-stack-data
          mountPath: /root/.llama
        - name: llama-stack-config
          mountPath: /app/run.yaml
          subPath: run.yaml
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8321
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8321
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: llama-stack-data
        persistentVolumeClaim:
          claimName: llama-stack-data
      - name: llama-stack-config
        configMap:
          name: llama-stack-run-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-stack-data
  namespace: llm-comparison
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: gp3-csi
